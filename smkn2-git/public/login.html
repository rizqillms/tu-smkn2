<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Sistem TU SMKN 2 Rantau</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
  body { background:linear-gradient(135deg,#f0f9ff,#e0f2fe); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card { background:#fff; border-radius:20px; box-shadow:0 20px 60px rgba(14,165,233,.18); padding:36px; width:100%; max-width:420px; }
  .logo { width:64px; height:64px; background:linear-gradient(135deg,#0ea5e9,#2563eb); border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 18px; }
  h1 { text-align:center; font-size:1.4rem; color:#0f172a; }
  .sub { text-align:center; color:#64748b; font-size:.88rem; margin:6px 0 24px; }
  label { font-size:.82rem; font-weight:700; color:#475569; display:block; margin-bottom:5px; }
  input { width:100%; padding:12px; border:1.5px solid #e2e8f0; border-radius:10px; font-size:.95rem; margin-bottom:14px; font-family:inherit; }
  input:focus { outline:none; border-color:#0ea5e9; box-shadow:0 0 0 3px rgba(14,165,233,.12); }
  .btn { width:100%; background:#2563eb; color:#fff; border:none; padding:13px; border-radius:10px; font-weight:700; font-size:.95rem; cursor:pointer; }
  .btn:hover { background:#1d4ed8; }
  .error { display:none; background:#fee2e2; color:#991b1b; padding:10px 14px; border-radius:8px; font-size:.85rem; margin-bottom:14px; }
  .hint { margin-top:18px; background:#f0f9ff; border:1px solid #e0f2fe; border-radius:10px; padding:12px; font-size:.78rem; color:#475569; line-height:1.7; }
  .hint b { color:#0369a1; }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">🎓</div>
  <h1>SMKN 2 Rantau</h1>
  <p class="sub">Sistem Informasi Tata Usaha<br>Silakan login untuk melanjutkan</p>
  <div class="error" id="err"></div>
  <form onsubmit="return doLogin(event)">
    <label>Username</label>
    <input id="username" placeholder="Contoh: kasubag" required autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button class="btn" type="submit">Masuk →</button>
  </form>
  <div style="text-align:center; margin-top:22px; font-size:.78rem; color:#94a3b8;">
    © 2026 <span style="color:#2563eb; font-weight:700;">LUCS TECH</span>
  </div>
</div>
<script>
async function doLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
  const data = await res.json();
  if (!res.ok) { document.getElementById('err').textContent = data.error || 'Login gagal'; document.getElementById('err').style.display='block'; return false; }
  localStorage.setItem('token', data.token);
  localStorage.setItem('user', JSON.stringify(data.user));
  window.location.href = '/';
  return false;
}
if (localStorage.getItem('token')) window.location.href = '/';
</script>
</body>
</html>
